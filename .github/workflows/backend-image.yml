name: Backend Image

# Builds the backend image that api.datsmysong.app runs, pushes it to GHCR and signs it with the
# repository's cosign key. Backend Deployment still deploys over SSH; this only publishes the image.
on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - commons/**
      - Dockerfile
      - .github/workflows/backend-image.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: backend-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/datsmysong/backend

jobs:
  publish:
    name: Build, push and sign
    # The server is linux/arm64. Public repositories get the GitHub-hosted arm64 runners for free.
    runs-on: ubuntu-24.04-arm
    # The cosign key lives in the release environment, which only main and release/* can use, so a
    # run dispatched from another ref stops here. Signing is not a deployment: the job records none.
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      # No context: the action builds from the Git context of this commit, so the image holds
      # neither a .git folder nor any file the runner adds.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/arm64
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      # Signs the pushed digest with the repository key. Nothing goes to the public transparency log.
      - name: Sign the image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          cosign sign --yes
          --key env://COSIGN_PRIVATE_KEY
          --use-signing-config=false
          --tlog-upload=false
          "${IMAGE}@${DIGEST}"
